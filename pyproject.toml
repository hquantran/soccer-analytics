[project]
name = "soccer-analytics"
version = "0.1.0"
description = "Soccer analytics ELT, Streamlit dashboard, and player recommender"
requires-python = ">=3.11"
dependencies = [
    # ELT
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "dlt[duckdb]>=1.27.2",
    "requests>=2.31.0",
    "certifi>=2024.0.0",
    # Dashboard
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "plotly>=5.18.0",
    "streamlit-keyup>=0.2.0",
    # Recommendation / notebooks
    "scikit-learn>=1.4.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "duckdb>=1.0.0",
]

[tool.uv]
package = false
