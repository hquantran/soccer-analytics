[api_sports]
# Get your key from https://dashboard.api-football.com/
key = "YOUR_API_KEY_HERE"
base_url = "https://v3.football.api-sports.io"

[api]
# Requests are paced to protect API quota. Pagination is unlimited by default.
# Lower values keep a full reingest moving faster while still respecting quota.
safe_pause_seconds = 2.0
max_retries = 3
quota_reserve = 5
