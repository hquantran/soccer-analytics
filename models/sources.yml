version: 2

sources:
  - name: raw
    description: Persisted API-Football history; local dlt tables or migrated Delta tables.
    database: "{{ env_var('DATABRICKS_CATALOG', 'workspace') if target.type == 'databricks' else target.database }}"
    schema: "{{ env_var('DATABRICKS_RAW_SCHEMA', 'soccer_analytics_data') }}"
    tables:
      - name: players_raw
        description: One row per player API response item.
      - name: players_raw__statistics
        description: Nested statistics rows (team/league/season stints).
