version: 2

models:
  - name: time_spine_daily
    description: Daily calendar spine spanning the persisted player seasons.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day

semantic_models:
  - name: player_seasons
    description: Additive player-team-league-season performance facts.
    model: ref('fct_player_seasons')
    defaults:
      agg_time_dimension: season_start_date
    entities:
      - name: player_season
        type: primary
        expr: player_season_id
      - name: player
        type: foreign
        expr: player_id
      - name: team
        type: foreign
        expr: team_id
      - name: league
        type: foreign
        expr: league_id
    dimensions:
      - name: season_start_date
        type: time
        type_params:
          time_granularity: day
      - name: season
        type: categorical
      - name: position
        type: categorical
      - name: injured
        type: categorical
    measures:
      - name: minutes_total
        description: Additive playing time in minutes.
        agg: sum
        expr: minutes
      - name: goals_total
        description: Additive goals scored.
        agg: sum
        expr: goals
      - name: goals_per90_numerator
        description: Goals scaled by 90 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['goals_per90']['numerator'] }} * {{ var('canonical_metrics')['goals_per90']['scale'] }}"
      - name: assists_per90_numerator
        description: Assists scaled by 90 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['assists_per90']['numerator'] }} * {{ var('canonical_metrics')['assists_per90']['scale'] }}"
      - name: key_passes_per90_numerator
        description: Key passes scaled by 90 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['key_passes_per90']['numerator'] }} * {{ var('canonical_metrics')['key_passes_per90']['scale'] }}"
      - name: tackles_per90_numerator
        description: Tackles scaled by 90 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['tackles_per90']['numerator'] }} * {{ var('canonical_metrics')['tackles_per90']['scale'] }}"
      - name: passes_completed_pct_numerator
        description: Estimated completed passes scaled by 100 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['pass_accuracy_pct']['numerator'] }} * {{ var('canonical_metrics')['pass_accuracy_pct']['scale'] }}"
      - name: passes_attempted_total
        description: Additive attempted passes.
        agg: sum
        expr: passes_total
      - name: duels_won_pct_numerator
        description: Duels won scaled by 100 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['duel_success_pct']['numerator'] }} * {{ var('canonical_metrics')['duel_success_pct']['scale'] }}"
      - name: duels_total
        description: Additive duels contested.
        agg: sum
        expr: duels_total
      - name: dribble_attempts_per90_numerator
        description: Dribble attempts scaled by 90 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['dribble_attempts_per90']['numerator'] }} * {{ var('canonical_metrics')['dribble_attempts_per90']['scale'] }}"
      - name: dribble_attempts_total
        description: Additive dribble attempts.
        agg: sum
        expr: dribbles_attempts
      - name: dribble_success_pct_numerator
        description: Successful dribbles scaled by 100 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['dribble_success_pct']['numerator'] }} * {{ var('canonical_metrics')['dribble_success_pct']['scale'] }}"

  - name: players
    description: Player attributes used to group player-season metrics.
    model: ref('dim_players')
    entities:
      - name: player
        type: primary
        expr: player_id
    dimensions:
      - name: player_name
        type: categorical
        expr: name
      - name: nationality
        type: categorical
      - name: age
        type: categorical

  - name: teams
    description: Team attributes used to group player-season metrics.
    model: ref('dim_teams')
    entities:
      - name: team
        type: primary
        expr: team_id
    dimensions:
      - name: team_name
        type: categorical

  - name: leagues
    description: League attributes used to group player-season metrics.
    model: ref('dim_leagues')
    entities:
      - name: league
        type: primary
        expr: league_id
    dimensions:
      - name: league_name
        type: categorical

metrics:
  - name: minutes_total
    description: Total playing minutes.
    type: simple
    type_params:
      measure: minutes_total

  - name: goals_per90_numerator
    type: simple
    type_params:
      measure: goals_per90_numerator

  - name: assists_per90_numerator
    type: simple
    type_params:
      measure: assists_per90_numerator

  - name: key_passes_per90_numerator
    type: simple
    type_params:
      measure: key_passes_per90_numerator

  - name: tackles_per90_numerator
    type: simple
    type_params:
      measure: tackles_per90_numerator

  - name: passes_completed_pct_numerator
    type: simple
    type_params:
      measure: passes_completed_pct_numerator

  - name: passes_attempted_total
    type: simple
    type_params:
      measure: passes_attempted_total

  - name: duels_won_pct_numerator
    type: simple
    type_params:
      measure: duels_won_pct_numerator

  - name: duels_total
    type: simple
    type_params:
      measure: duels_total

  - name: dribble_attempts_per90_numerator
    type: simple
    type_params:
      measure: dribble_attempts_per90_numerator

  - name: dribble_attempts_total
    type: simple
    type_params:
      measure: dribble_attempts_total

  - name: dribble_success_pct_numerator
    type: simple
    type_params:
      measure: dribble_success_pct_numerator

  - name: goals_per90
    description: Goals per 90 minutes using aggregated goals and minutes.
    type: ratio
    type_params:
      numerator: goals_per90_numerator
      denominator: minutes_total

  - name: assists_per90
    description: Assists per 90 minutes using aggregated assists and minutes.
    type: ratio
    type_params:
      numerator: assists_per90_numerator
      denominator: minutes_total

  - name: key_passes_per90
    description: Key passes per 90 minutes using aggregated key passes and minutes.
    type: ratio
    type_params:
      numerator: key_passes_per90_numerator
      denominator: minutes_total

  - name: tackles_per90
    description: Tackles per 90 minutes using aggregated tackles and minutes.
    type: ratio
    type_params:
      numerator: tackles_per90_numerator
      denominator: minutes_total

  - name: pass_accuracy_pct
    description: Estimated completed passes as a percentage of attempted passes.
    type: ratio
    type_params:
      numerator: passes_completed_pct_numerator
      denominator: passes_attempted_total

  - name: duel_success_pct
    description: Duels won as a percentage of total duels.
    type: ratio
    type_params:
      numerator: duels_won_pct_numerator
      denominator: duels_total

  - name: dribble_attempts_per90
    description: Dribble attempts per 90 minutes using aggregated attempts and minutes.
    type: ratio
    type_params:
      numerator: dribble_attempts_per90_numerator
      denominator: minutes_total

  - name: dribble_success_pct
    description: Successful dribbles as a percentage of attempts.
    type: ratio
    type_params:
      numerator: dribble_success_pct_numerator
      denominator: dribble_attempts_total
