version: 2

models:
  - name: time_spine_daily
    description: Daily calendar spine spanning the persisted player seasons.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day

semantic_models:
  - name: player_seasons
    description: Additive player-team-league-season performance facts.
    model: ref('fct_player_seasons')
    defaults:
      agg_time_dimension: season_start_date
    entities:
      - name: player_season
        type: primary
        expr: player_season_id
      - name: player
        type: foreign
        expr: player_id
      - name: team
        type: foreign
        expr: team_id
      - name: league
        type: foreign
        expr: league_id
    dimensions:
      - name: stint_id
        type: categorical
        expr: player_season_id
      - name: season_start_date
        type: time
        type_params:
          time_granularity: day
      - name: season
        type: categorical
      - name: position
        type: categorical
      - name: injured
        type: categorical
    measures:
      - name: minutes_total
        description: Additive playing time in minutes.
        agg: sum
        expr: minutes
      - name: goals_total
        description: Additive goals scored.
        agg: sum
        expr: goals
      - name: goals_per90_numerator
        description: Goals scaled by 90 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['goals_per90']['numerator'] }} * {{ var('canonical_metrics')['goals_per90']['scale'] }}"
      - name: assists_per90_numerator
        description: Assists scaled by 90 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['assists_per90']['numerator'] }} * {{ var('canonical_metrics')['assists_per90']['scale'] }}"
      - name: key_passes_per90_numerator
        description: Key passes scaled by 90 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['key_passes_per90']['numerator'] }} * {{ var('canonical_metrics')['key_passes_per90']['scale'] }}"
      - name: tackles_per90_numerator
        description: Tackles scaled by 90 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['tackles_per90']['numerator'] }} * {{ var('canonical_metrics')['tackles_per90']['scale'] }}"
      - name: passes_completed_pct_numerator
        description: Estimated completed passes scaled by 100 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['pass_accuracy_pct']['numerator'] }} * {{ var('canonical_metrics')['pass_accuracy_pct']['scale'] }}"
      - name: passes_attempted_total
        description: Additive attempted passes.
        agg: sum
        expr: passes_total
      - name: duels_won_pct_numerator
        description: Duels won scaled by 100 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['duel_success_pct']['numerator'] }} * {{ var('canonical_metrics')['duel_success_pct']['scale'] }}"
      - name: duels_total
        description: Additive duels contested.
        agg: sum
        expr: duels_total
      - name: dribble_attempts_per90_numerator
        description: Dribble attempts scaled by 90 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['dribble_attempts_per90']['numerator'] }} * {{ var('canonical_metrics')['dribble_attempts_per90']['scale'] }}"
      - name: dribble_attempts_total
        description: Additive dribble attempts.
        agg: sum
        expr: dribbles_attempts
      - name: dribble_success_pct_numerator
        description: Successful dribbles scaled by 100 before aggregation.
        agg: sum
        expr: "{{ var('canonical_metrics')['dribble_success_pct']['numerator'] }} * {{ var('canonical_metrics')['dribble_success_pct']['scale'] }}"

      - name: goal_involvements_per90_numerator
        agg: sum
        expr: "{{ var('canonical_metrics')['goal_involvements_per90']['numerator'] if var('canonical_metrics')['goal_involvements_per90']['numerator'] is string else '(' ~ (var('canonical_metrics')['goal_involvements_per90']['numerator'] | join(' + ')) ~ ')' }} * {{ var('canonical_metrics')['goal_involvements_per90']['scale'] }}"
      - name: successful_dribbles_per90_numerator
        agg: sum
        expr: "{{ var('canonical_metrics')['successful_dribbles_per90']['numerator'] }} * {{ var('canonical_metrics')['successful_dribbles_per90']['scale'] }}"
      - name: shot_accuracy_pct_numerator
        agg: sum
        expr: "{{ var('canonical_metrics')['shot_accuracy_pct']['numerator'] }} * {{ var('canonical_metrics')['shot_accuracy_pct']['scale'] }}"
      - name: goal_conversion_pct_numerator
        agg: sum
        expr: "{{ var('canonical_metrics')['goal_conversion_pct']['numerator'] }} * {{ var('canonical_metrics')['goal_conversion_pct']['scale'] }}"
      - name: fouls_per_tackle_numerator
        agg: sum
        expr: "{{ var('canonical_metrics')['fouls_per_tackle']['numerator'] }} * {{ var('canonical_metrics')['fouls_per_tackle']['scale'] }}"
      - name: shots_per90_numerator
        agg: sum
        expr: "{{ var('canonical_metrics')['shots_per90']['numerator'] }} * {{ var('canonical_metrics')['shots_per90']['scale'] }}"
      - name: passes_per90_numerator
        agg: sum
        expr: "{{ var('canonical_metrics')['passes_per90']['numerator'] }} * {{ var('canonical_metrics')['passes_per90']['scale'] }}"
      - name: fouls_drawn_per90_numerator
        agg: sum
        expr: "{{ var('canonical_metrics')['fouls_drawn_per90']['numerator'] }} * {{ var('canonical_metrics')['fouls_drawn_per90']['scale'] }}"
      - name: shots_total
        agg: sum
        expr: shots_total
      - name: tackles_total
        agg: sum
        expr: tackles_total

      - name: goals_per90_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['goals_per90']['denominator'] }}"
      - name: assists_per90_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['assists_per90']['denominator'] }}"
      - name: key_passes_per90_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['key_passes_per90']['denominator'] }}"
      - name: tackles_per90_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['tackles_per90']['denominator'] }}"
      - name: pass_accuracy_pct_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['pass_accuracy_pct']['denominator'] }}"
      - name: duel_success_pct_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['duel_success_pct']['denominator'] }}"
      - name: dribble_attempts_per90_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['dribble_attempts_per90']['denominator'] }}"
      - name: dribble_success_pct_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['dribble_success_pct']['denominator'] }}"
      - name: goal_involvements_per90_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['goal_involvements_per90']['denominator'] }}"
      - name: successful_dribbles_per90_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['successful_dribbles_per90']['denominator'] }}"
      - name: shot_accuracy_pct_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['shot_accuracy_pct']['denominator'] }}"
      - name: goal_conversion_pct_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['goal_conversion_pct']['denominator'] }}"
      - name: fouls_per_tackle_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['fouls_per_tackle']['denominator'] }}"
      - name: shots_per90_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['shots_per90']['denominator'] }}"
      - name: passes_per90_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['passes_per90']['denominator'] }}"
      - name: fouls_drawn_per90_denominator
        agg: sum
        expr: "{{ var('canonical_metrics')['fouls_drawn_per90']['denominator'] }}"

      - name: minutes_additive
        agg: sum
        expr: minutes
      - name: appearances_additive
        agg: sum
        expr: appearances
      - name: goals_additive
        agg: sum
        expr: goals
      - name: assists_additive
        agg: sum
        expr: assists
      - name: shots_total_additive
        agg: sum
        expr: shots_total
      - name: shots_on_target_additive
        agg: sum
        expr: shots_on_target
      - name: passes_total_additive
        agg: sum
        expr: passes_total
      - name: passes_completed_additive
        agg: sum
        expr: passes_completed
      - name: passes_key_additive
        agg: sum
        expr: passes_key
      - name: tackles_total_additive
        agg: sum
        expr: tackles_total
      - name: duels_total_additive
        agg: sum
        expr: duels_total
      - name: duels_won_additive
        agg: sum
        expr: duels_won
      - name: dribbles_attempts_additive
        agg: sum
        expr: dribbles_attempts
      - name: dribbles_success_additive
        agg: sum
        expr: dribbles_success
      - name: fouls_drawn_additive
        agg: sum
        expr: fouls_drawn
      - name: fouls_committed_additive
        agg: sum
        expr: fouls_committed
      - name: rating_weighted_numerator
        agg: sum
        expr: coalesce(rating, 0) * minutes

  - name: players
    description: Player attributes used to group player-season metrics.
    model: ref('dim_players')
    entities:
      - name: player
        type: primary
        expr: player_id
    dimensions:
      - name: player_name
        type: categorical
        expr: name
      - name: nationality
        type: categorical
      - name: age
        type: categorical

  - name: teams
    description: Team attributes used to group player-season metrics.
    model: ref('dim_teams')
    entities:
      - name: team
        type: primary
        expr: team_id
    dimensions:
      - name: team_name
        type: categorical

  - name: leagues
    description: League attributes used to group player-season metrics.
    model: ref('dim_leagues')
    entities:
      - name: league
        type: primary
        expr: league_id
    dimensions:
      - name: league_name
        type: categorical

